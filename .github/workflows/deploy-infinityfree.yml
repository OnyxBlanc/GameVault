name: Déployer la vitrine sur InfinityFree
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: infinityfree-vitrine
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Préparer la vitrine
        run: |
          mkdir -p dist
          cp docs/index.html dist/
          cp -R docs/assets dist/
      - name: Installer lftp
        run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Transférer en FTPS explicite
        env:
          FTP_USER: ${{ secrets.INFINITYFREE_FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
        run: |
          test -n "$FTP_USER" && test -n "$LFTP_PASSWORD" || { echo 'Secrets FTP manquants'; exit 1; }
          lftp --env-password -u "$FTP_USER" ftp://ftpupload.net:21 <<'LFTP'
          set cmd:fail-exit yes
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          set net:max-retries 2
          set net:timeout 20s
          cd /htdocs
          mirror --reverse --verbose dist .
          bye
          LFTP
