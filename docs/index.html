<!doctype html>
<html lang='fr'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<meta name='theme-color' content='#07070c'>
<title>GameVault</title>
<meta name='description' content='Collectionne des jeux vidéo sous forme de cartes.'>
<link rel='stylesheet' href='./assets/style.css?v=4'>
<link rel='stylesheet' href='./assets/booster.css?v=6'>
<link rel='stylesheet' href='./assets/inspect.css?v=3'>
<link rel='stylesheet' href='./assets/succes.css?v=1'>
<link rel='stylesheet' href='./assets/admin.css?v=1'>
<link rel='stylesheet' href='./assets/profile.css?v=1'>
<script src='./assets/app.js?v=4' defer></script>
<script src='./assets/booster.js?v=6' defer></script>
<script src='./assets/inspect.js?v=3' defer></script>
<script src='./assets/succes.js?v=1' defer></script>
<script src='./assets/admin.js?v=2' defer></script>
<script src='./assets/profile.js?v=1' defer></script>
</head>
<body>
<header class='top'>
  <a class='brand' href='./' aria-label='GameVault'>
    <svg width='32' height='32' viewBox='0 0 32 32' aria-hidden='true'><rect x='1.5' y='1.5' width='29' height='29' rx='8' fill='#14141c' stroke='#f5c518' stroke-width='2'/><path d='M16 7l8 4.5v9L16 25l-8-4.5v-9z' fill='none' stroke='#f5c518' stroke-width='2' stroke-linejoin='round'/><path d='M16 12l4 4-4 4-4-4z' fill='#f5c518'/></svg>
    <h1>GAMEVAULT</h1>
  </a>
  <nav class='tabs'>
    <button type='button' class='tab active' data-view='catalogue'>Catalogue</button>
    <button type='button' class='tab' data-view='collection'>Ma collection</button>
    <button type='button' id='tab-booster'>Boosters</button>
    <button type='button' id='tab-succes'>Succès</button>
    <button type='button' id='tab-profile'>Profil</button>
    <button type='button' id='tab-admin' hidden>Admin</button>
  </nav>
  <div id='account' class='account'></div>
</header>
<main>
  <div id='browse'>
    <section class='toolbar'>
      <input id='search' type='search' placeholder='Rechercher un jeu' maxlength='100' aria-label='Rechercher un jeu'>
      <select id='genre' aria-label='Filtrer par genre'><option value=''>Tous les genres</option></select>
      <select id='sort' aria-label='Trier par'>
        <option value='nom_asc'>Nom A → Z</option>
        <option value='nom_desc'>Nom Z → A</option>
        <option value='rarete_desc'>Rareté : la plus rare d'abord</option>
        <option value='rarete_asc'>Rareté : la plus commune d'abord</option>
      </select>
    </section>
    <section id='starter' class='panel' hidden>
      <p id='starter-text'>Bienvenue ! Ouvre ton pack de départ pour recevoir 5 jeux.</p>
      <button type='button' id='starter-btn' class='primary'>Ouvrir mon pack</button>
      <div id='starter-result' class='grid'></div>
    </section>
    <p id='status' role='status'></p>
    <section id='grid' class='grid'></section>
    <nav class='pager'>
      <button type='button' id='prev'>Précédent</button>
      <span id='page-info'></span>
      <button type='button' id='next'>Suivant</button>
    </nav>
  </div>
  <section id='booster' hidden>
    <div id='b-stage' class='b-stage'>
      <div id='b-pack' class='b-pack' role='button' tabindex='0' aria-label='Booster GameVault'>
        <div id='b-pack-art' class='b-pack-art'></div>
        <div id='b-tear' class='b-tear' aria-hidden='true'><span id='b-tear-line' class='b-tear-line'></span></div>
      </div>
      <div class='b-shadow' aria-hidden='true'></div>
      <p id='b-hint' class='b-hint'>Glisse le long du haut pour déchirer</p>
      <div id='b-options' class='b-pills' role='group' aria-label='Nombre de boosters'></div>
      <button type='button' id='b-open' class='cta'><strong>Ouvrir</strong><span class='sep' aria-hidden='true'>|</span><span id='b-open-sub'></span></button>
      <p id='b-timer' class='b-timer'></p>
      <p id='b-info' class='b-meta' role='status'></p>
      <details id='b-odds-box' class='b-odds-box'>
        <summary>Probabilités pour cette ouverture</summary>
        <ul id='b-odds' class='odds'></ul>
      </details>
    </div>
    <p id='b-msg' role='status'></p>
    <p id='b-summary' role='status'></p>
    <div id='b-result' class='grid'></div>
  </section>
  <section id='succes' hidden>
    <div class='s-head'>
      <div>
        <h2>Succès</h2>
        <p id='s-summary'></p>
      </div>
      <button type='button' id='s-claim-all' class='primary' hidden></button>
    </div>
    <p id='s-msg' class='s-msg' role='status'></p>
    <div id='s-grid' class='s-grid'></div>
  </section>
  <section id='profile' hidden>
    <div id='p-body'></div>
  </section>
  <section id='admin' hidden>
    <div class='a-head'>
      <h2>Administration</h2>
      <div class='a-subtabs'>
        <button type='button' data-sub='overview' class='active'>Vue d'ensemble</button>
        <button type='button' data-sub='players'>Joueurs &amp; Modération</button>
        <button type='button' data-sub='games'>Catalogue</button>
        <button type='button' data-sub='settings'>Marché &amp; Paramètres</button>
      </div>
    </div>
    <p id='a-msg' class='a-msg' role='status'></p>
    <div id='a-body'></div>
  </section>
</main>
<dialog id='auth'>
  <form id='auth-form'>
    <h2 id='auth-title'>Connexion</h2>
    <label id='email-wrap' hidden>Email<input id='email' type='email' maxlength='190' autocomplete='email'></label>
    <label>Pseudo<input id='pseudo' required minlength='3' maxlength='32' autocomplete='username'></label>
    <label>Mot de passe<input id='password' type='password' required minlength='8' maxlength='200' autocomplete='current-password'></label>
    <p id='auth-error' class='error' role='alert'></p>
    <div class='actions'>
      <button type='submit' id='auth-submit' class='primary'>Se connecter</button>
      <button type='button' id='auth-switch' class='ghost'>Pas de compte ? Créer un compte</button>
      <button type='button' id='auth-cancel' class='ghost'>Annuler</button>
    </div>
  </form>
</dialog>
<dialog id='p-edit' class='p-dialog'>
  <form id='pe-form' class='p-form'>
    <h2>Personnaliser mon profil</h2>
    <label>Bio (160 car. max)<textarea id='pe-bio' maxlength='160' rows='3'></textarea></label>
    <label>URL de l'avatar (https://…)<input id='pe-avatar' type='url' maxlength='500'></label>
    <label>Titre affiché<input id='pe-titre' type='text' maxlength='64' placeholder='Ex: Pilier de la salle'></label>
    <label>Cadre d'avatar
      <select id='pe-frame'>
        <option value='auto'>Automatique</option>
        <option value='or'>Or</option>
        <option value='mythique'>Mythique</option>
        <option value='ethere'>Éthéré</option>
        <option value='sakura'>Sakura</option>
        <option value='neon'>Néon</option>
      </select>
    </label>
    <label>Style du pseudo
      <select id='pe-pstyle'>
        <option value='default'>Par défaut</option>
        <option value='sakura'>Sakura</option>
        <option value='ocean'>Océan</option>
        <option value='braise'>Braise</option>
        <option value='or'>Or</option>
        <option value='prisme'>Dégradé Prisme</option>
        <option value='aurore'>Dégradé Aurore</option>
      </select>
    </label>
    <label>Thème du profil
      <select id='pe-theme'>
        <option value='none'>Aucun</option>
        <option value='sakura'>Sakura</option>
        <option value='nuit'>Nuit étoilée</option>
        <option value='ocean'>Océan</option>
        <option value='braise'>Braise</option>
        <option value='jade'>Jade</option>
        <option value='or'>Or</option>
      </select>
    </label>
    <label>Style de vitrine
      <select id='pe-sstyle'>
        <option value='projecteur'>Projecteur (1re carte en grand)</option>
        <option value='classeur'>Classeur (toutes à plat)</option>
      </select>
    </label>
    <label>Confidentialité du profil
      <select id='pe-priv-p'>
        <option value='public'>Public</option>
        <option value='private'>Privé</option>
      </select>
    </label>
    <label>Confidentialité de la collection
      <select id='pe-priv-c'>
        <option value='public'>Public</option>
        <option value='private'>Privé</option>
      </select>
    </label>
    <p id='pe-err' class='error' role='alert'></p>
    <div class='actions'>
      <button type='submit' class='primary'>Enregistrer</button>
      <button type='button' id='pe-cancel' class='ghost'>Annuler</button>
    </div>
  </form>
</dialog>
<dialog id='p-showcase-dlg' class='p-dialog'>
  <h2>Choisir ma vitrine (max 7)</h2>
  <p id='ps-count' class='meta'></p>
  <div id='ps-grid' class='p-picker-grid'></div>
  <div class='actions' style='margin-top:1rem'>
    <button type='button' id='ps-save' class='primary'>Enregistrer la vitrine</button>
    <button type='button' id='ps-cancel' class='ghost'>Annuler</button>
  </div>
</dialog>
</body>
</html>
