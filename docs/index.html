<!doctype html>
<html lang='fr'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<meta name='theme-color' content='#09090d'>
<title>GameVault</title>
<meta name='description' content='Collectionne des jeux vidéo sous forme de cartes.'>
<link rel='stylesheet' href='./assets/style.css?v=2'>
<link rel='stylesheet' href='./assets/booster.css?v=2'>
<link rel='stylesheet' href='./assets/inspect.css?v=2'>
<script src='./assets/app.js?v=2' defer></script>
<script src='./assets/booster.js?v=2' defer></script>
<script src='./assets/inspect.js?v=2' defer></script>
</head>
<body>
<header class='top'>
  <a class='brand' href='./' aria-label='GameVault'>
    <svg width='32' height='32' viewBox='0 0 32 32' aria-hidden='true'><rect x='1.5' y='1.5' width='29' height='29' rx='8' fill='#14141c' stroke='#f5c518' stroke-width='2'/><path d='M16 7l8 4.5v9L16 25l-8-4.5v-9z' fill='none' stroke='#f5c518' stroke-width='2' stroke-linejoin='round'/><path d='M16 12l4 4-4 4-4-4z' fill='#f5c518'/></svg>
    <h1>GAMEVAULT</h1>
  </a>
  <nav class='tabs'>
    <button type='button' class='tab active' data-view='catalogue'>Catalogue</button>
    <button type='button' class='tab' data-view='collection'>Ma collection</button>
    <button type='button' id='tab-booster'>Boosters</button>
  </nav>
  <div id='account' class='account'></div>
</header>
<main>
  <div id='browse'>
    <section class='toolbar'>
      <input id='search' type='search' placeholder='Rechercher un jeu' maxlength='100' aria-label='Rechercher un jeu'>
      <select id='genre' aria-label='Filtrer par genre'><option value=''>Tous les genres</option></select>
      <select id='sort' aria-label='Trier par'>
        <option value='nom_asc'>Nom A → Z</option>
        <option value='nom_desc'>Nom Z → A</option>
        <option value='rarete_desc'>Rareté : la plus rare d'abord</option>
        <option value='rarete_asc'>Rareté : la plus commune d'abord</option>
      </select>
    </section>
    <section id='starter' class='panel' hidden>
      <p id='starter-text'>Bienvenue ! Ouvre ton pack de départ pour recevoir 5 jeux.</p>
      <button type='button' id='starter-btn' class='primary'>Ouvrir mon pack</button>
      <div id='starter-result' class='grid'></div>
    </section>
    <p id='status' role='status'></p>
    <section id='grid' class='grid'></section>
    <nav class='pager'>
      <button type='button' id='prev'>Précédent</button>
      <span id='page-info'></span>
      <button type='button' id='next'>Suivant</button>
    </nav>
  </div>
  <section id='booster' hidden>
    <div class='b-hero'>
      <div>
        <h2>Boosters</h2>
        <p>Chaque booster contient 5 cartes. Un booster gratuit toutes les 5 minutes, 50 en stock au maximum.</p>
      </div>
      <svg width='210' height='120' viewBox='0 0 210 120' aria-hidden='true'><defs><linearGradient id='hg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#f5c518'/><stop offset='1' stop-color='#8a6d00'/></linearGradient></defs><g transform='translate(105 66)'><rect x='-60' y='-48' width='56' height='86' rx='8' fill='#1c1c2b' stroke='#38bdf8' stroke-width='2' transform='rotate(-18 -32 0)'/><rect x='4' y='-48' width='56' height='86' rx='8' fill='#1c1c2b' stroke='#a855f7' stroke-width='2' transform='rotate(18 32 0)'/><rect x='-28' y='-56' width='56' height='92' rx='8' fill='url(#hg)' stroke='#fff3b0' stroke-width='2'/><circle cx='0' cy='-10' r='14' fill='#17130a'/><path d='M0 -20l3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z' fill='#f5c518'/></g></svg>
    </div>
    <div id='b-info' class='chips' role='status'></div>
    <div class='b-layout'>
      <div class='b-main'>
        <h2 class='b-title'>Choisis ton booster</h2>
        <div id='b-options' class='packs'></div>
      </div>
      <aside id='b-side' class='side' hidden>
        <div class='side-head'>
          <span id='b-side-medal' class='medal'></span>
          <div><h3 id='b-side-title'></h3><p id='b-side-sub'></p></div>
        </div>
        <div id='b-tiles' class='tiles'></div>
        <h4>Chance par ouverture (au moins une carte)</h4>
        <ul id='b-odds' class='odds'></ul>
        <button type='button' id='b-open' class='cta'><strong>Ouvrir</strong><span id='b-open-sub'></span></button>
        <p id='b-timer'></p>
      </aside>
    </div>
    <p id='b-msg' role='status'></p>
    <p id='b-summary' role='status'></p>
    <div id='b-result' class='grid'></div>
  </section>
</main>
<dialog id='auth'>
  <form id='auth-form'>
    <h2>Connexion</h2>
    <label>Pseudo<input id='pseudo' required minlength='3' maxlength='32' autocomplete='username'></label>
    <label>Mot de passe<input id='password' type='password' required minlength='8' maxlength='200' autocomplete='current-password'></label>
    <p id='auth-error' class='error' role='alert'></p>
    <div class='actions'>
      <button type='submit' value='login'>Se connecter</button>
      <button type='submit' value='register'>Créer un compte</button>
      <button type='button' id='auth-cancel' class='ghost'>Annuler</button>
    </div>
  </form>
</dialog>
</body>
</html>
